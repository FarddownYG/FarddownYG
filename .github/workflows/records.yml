name: Statistiques du profil

# Recalcule toutes les cartes de statistiques à partir du calendrier de
# contributions, et les publie sur la branche « stats ».
#
# La planification ne sert plus à cadencer les calculs, seulement à s'assurer
# qu'une exécution est vivante : GitHub n'honore pas les créneaux rapprochés.
# Mesuré sur ce dépôt, « */10 » (six par heure) donnait une exécution par heure,
# avec jusqu'à 90 minutes de trou — c'était toute la latence constatée sur le
# profil. La cadence réelle est donc tenue par tools/boucle-stats.sh, qui
# recalcule toutes les deux minutes pendant toute la durée du run et ne publie
# que lorsqu'un chiffre a bougé.
#
# Pourquoi une branche séparée plutôt que main : GitHub ne compte dans le
# graphe de contributions que les commits de la branche par défaut et de
# gh-pages. Publier ici évite qu'un commit automatique gonfle artificiellement
# la série — ce serait la contredire.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build-stats.py
      - tools/boucle-stats.sh
      - tools/empreinte.py
      - tools/test-stats.py
      - .github/workflows/records.yml

permissions:
  contents: write

# Une seule boucle vivante à la fois : chaque nouveau déclenchement remplace la
# précédente. C'est aussi ce qui redémarre la chaîne si un run meurt.
concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier le calcul avant de publier
        run: python tools/test-stats.py

      - name: Recalculer en boucle et publier à chaque changement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: bash tools/boucle-stats.sh
