name: Records de contributions

# Recalcule chaque jour les records à partir du calendrier de contributions
# et publie les deux cartes SVG sur la branche « stats ».
#
# Pourquoi une branche séparée plutôt que main : GitHub ne compte dans le
# graphe de contributions que les commits de la branche par défaut et de
# gh-pages. Publier ici évite qu'un commit automatique quotidien gonfle
# artificiellement la série — ce serait la contredire.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build-stats.py
      - .github/workflows/records.yml

permissions:
  contents: write

concurrency:
  group: records
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les cartes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python tools/build-stats.py out/records-dark.svg out/records-light.svg

      - name: Publier sur la branche stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Records au $(date -u +%Y-%m-%d)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            stats:refs/heads/stats
