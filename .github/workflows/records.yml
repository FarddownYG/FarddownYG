name: Statistiques du profil

# Recalcule toutes les cartes de statistiques à partir du calendrier de
# contributions, et les publie sur la branche « stats ».
#
# Toutes les dix minutes. GitHub ne propose pas de déclencheur sur « une
# contribution a eu lieu » — un dépôt ne peut pas être notifié de l'activité
# de son propriétaire ailleurs. Le plus proche du temps réel est donc une
# interrogation rapprochée ; le plancher imposé par GitHub est de 5 minutes,
# on reste juste au-dessus. Chaque carte porte l'heure de son calcul, la
# fraîcheur est donc vérifiable d'un coup d'œil.
#
# Pourquoi une branche séparée plutôt que main : GitHub ne compte dans le
# graphe de contributions que les commits de la branche par défaut et de
# gh-pages. Publier ici évite qu'un commit automatique gonfle artificiellement
# la série — ce serait la contredire.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build-stats.py
      - .github/workflows/records.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les cartes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python tools/build-stats.py out

      - name: Publier sur la branche stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Statistiques au $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            stats:refs/heads/stats
