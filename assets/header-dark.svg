<svg viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hTitle">
  <title id="hTitle">Yanis — l’as de pique : backend, cybersécurité, game dev</title>

  <defs>
    <!-- La pique-lame : tracé maître réutilisé (emblème, index de coins, pips) -->
    <path id="spade" d="M100,8 C96,34 60,64 42,92 C28,114 26,132 34,148 C44,166 70,172 86,158 C92,152 96,146 97,140 C95,172 86,196 68,212 C64,216 66,220 71,220 L129,220 C134,220 136,216 132,212 C114,196 105,172 103,140 C104,146 108,152 114,158 C130,172 156,166 166,148 C174,132 172,114 158,92 C140,64 104,34 100,8 Z"/>
    <clipPath id="spadeClip"><use href="#spade"/></clipPath>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0F15"/>
      <stop offset="0.55" stop-color="#10141D"/>
      <stop offset="1" stop-color="#151B28"/>
    </linearGradient>
    <linearGradient id="spadeSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF1F6"/>
      <stop offset="0.45" stop-color="#B9C2D0"/>
      <stop offset="0.8" stop-color="#8A93A5"/>
      <stop offset="1" stop-color="#A7B0C0"/>
    </linearGradient>
    <linearGradient id="steelEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C8698" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="steelText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="0.6" stop-color="#C4CCD9"/>
      <stop offset="1" stop-color="#97A1B2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8A96A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C8A96A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#C8A96A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8A96A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#C8A96A" stop-opacity="0"/>
    </radialGradient>
    <filter id="spadeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#C8A96A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ulClip"><rect x="370" y="158.5" width="308" height="4"/></clipPath>

    <!-- Machines à écrire du terminal : fenêtres de clip -->
    <clipPath id="type1"><rect x="392" y="278" height="18" width="0">
      <animate attributeName="width" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze"
        values="0;8;16;23;31;39;47;54;62;62"
        keyTimes="0;0.0456;0.0538;0.0619;0.07;0.0781;0.0863;0.0944;0.1025;1"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="392" y="322" height="18" width="0">
      <animate attributeName="width" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze"
        values="0;8;16;23;31;39;47;54;62;70;78;85;85"
        keyTimes="0;0.1694;0.1763;0.1831;0.19;0.1969;0.2038;0.2106;0.2175;0.2244;0.2313;0.2381;1"/>
    </rect></clipPath>
  </defs>

  <style>
    text { -webkit-user-select: none; user-select: none; }
    .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .serif { font-family: Georgia,'Times New Roman',serif; }
    .rise { opacity: 0; animation: rise 0.8s cubic-bezier(0.22,0.61,0.36,1) forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 0.4s; } .d4 { animation-delay: 0.55s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; opacity: 1; }
      .sheen-r, .cursor { display: none; }
      #type1 rect { width: 62px !important; }
      #type2 rect { width: 85px !important; }
      .out { opacity: 1 !important; }
    }
  </style>

  <!-- Carte -->
  <rect x="8" y="8" width="984" height="404" rx="18" fill="url(#bgGrad)" stroke="#2A3140" stroke-width="1.4"/>
  <rect x="20" y="20" width="960" height="380" rx="12" stroke="#232A36" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Index de coins, comme sur une vraie carte -->
  <g id="idx">
    <text x="46" y="60" class="serif" font-size="30" fill="#E8EAF0" text-anchor="middle">A</text>
    <use href="#spade" transform="translate(38.5,68) scale(0.075)" fill="#C8A96A"/>
  </g>
  <use href="#idx" transform="rotate(180 500 210)"/>

  <!-- Emblème : la pique comme une lame -->
  <g class="rise">
    <ellipse cx="194" cy="210" rx="150" ry="150" fill="url(#glow)"/>
    <g transform="translate(94,90)">
      <g>
        <animateTransform attributeName="transform" type="translate" additive="sum"
          values="0 0;0 -6;0 0" keyTimes="0;0.5;1" dur="7s"
          calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
        <use href="#spade" fill="url(#spadeSteel)" stroke="url(#steelEdge)" stroke-width="1.5" filter="url(#spadeGlow)"/>
        <path d="M100,34 C101.6,62 101.6,102 100,140 C98.4,102 98.4,62 100,34 Z" fill="#C8A96A" opacity="0.5"/>
        <g clip-path="url(#spadeClip)">
          <g transform="skewX(-16)">
            <rect class="sheen-r" x="-70" y="-10" width="44" height="260" fill="url(#sheen)">
              <animateTransform attributeName="transform" type="translate"
                values="0 0;340 0;340 0" keyTimes="0;0.22;1" dur="9s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Bloc identité -->
  <g class="rise d1">
    <text x="370" y="91" class="mono" font-size="12" letter-spacing="4" fill="#C8A96A">// L’AS DE PIQUE</text>
  </g>
  <g class="rise d2">
    <text x="366" y="148" class="sans" font-size="58" font-weight="800" letter-spacing="10" fill="url(#steelText)" textLength="210" lengthAdjust="spacing">YANIS</text>
    <rect x="370" y="159.5" width="308" height="1.4" fill="#2A3140"/>
    <g clip-path="url(#ulClip)">
      <rect x="300" y="158.8" width="70" height="2.4" fill="url(#pulse)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;400 0;400 0" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Pills compétences -->
  <g class="rise d3">
    <g>
      <rect x="370" y="182" width="122" height="34" rx="17" stroke="#3A4150" stroke-width="1.2" fill="#E8EAF0" fill-opacity="0.04"/>
      <g stroke="#C8A96A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M389,192 l5.5,4.5 -5.5,4.5"/><path d="M398.5,202.5 h6"/>
      </g>
      <text x="412" y="204" class="mono" font-size="12" letter-spacing="1.5" fill="#C6CCD8" textLength="61" lengthAdjust="spacingAndGlyphs">BACKEND</text>
    </g>
    <g>
      <rect x="504" y="182" width="174" height="34" rx="17" stroke="#3A4150" stroke-width="1.2" fill="#E8EAF0" fill-opacity="0.04"/>
      <path transform="translate(522,191)" d="M8,1.5 L14,4 V8.2 C14,11.8 11.4,14 8,15 C4.6,14 2,11.8 2,8.2 V4 Z"
        stroke="#C8A96A" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
      <text x="547" y="204" class="mono" font-size="12" letter-spacing="1.5" fill="#C6CCD8" textLength="113" lengthAdjust="spacingAndGlyphs">CYBERSÉCURITÉ</text>
    </g>
    <g>
      <rect x="690" y="182" width="131" height="34" rx="17" stroke="#3A4150" stroke-width="1.2" fill="#E8EAF0" fill-opacity="0.04"/>
      <g transform="translate(708,191)">
        <path d="M2,8 a3,3 0 0 1 3,-3 h6 a3,3 0 0 1 3,3 v1.5 a2.5,2.5 0 0 1 -4.5,1.6 h-3 a2.5,2.5 0 0 1 -4.5,-1.6 z"
          stroke="#C8A96A" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        <path d="M4.2,7.5 h2.4 M5.4,6.3 v2.4" stroke="#C8A96A" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="11.6" cy="7.2" r="0.95" fill="#C8A96A"/>
      </g>
      <text x="733" y="204" class="mono" font-size="12" letter-spacing="1.5" fill="#C6CCD8" textLength="70" lengthAdjust="spacingAndGlyphs">GAME DEV</text>
    </g>
  </g>

  <!-- Terminal -->
  <g class="rise d4">
    <rect x="370" y="238" width="540" height="130" rx="10" fill="#0C0F14" stroke="#232A36" stroke-width="1.2"/>
    <path d="M371,266 H909" stroke="#202733" stroke-width="1"/>
    <circle cx="390" cy="252" r="4" fill="#6B7280"/>
    <circle cx="406" cy="252" r="4" fill="#9AA3B2"/>
    <circle cx="422" cy="252" r="4" fill="#C8A96A"/>
    <text x="442" y="256" class="mono" font-size="11" fill="#7E8794">yanis@spade:~</text>

    <text x="392" y="290" class="mono" font-size="13" clip-path="url(#type1)" fill="#C8A96A" textLength="7.75" lengthAdjust="spacingAndGlyphs">$</text><text x="407.5" y="290" class="mono" font-size="13" clip-path="url(#type1)" fill="#E8EAF0" textLength="46.5" lengthAdjust="spacingAndGlyphs">whoami</text>
    <text x="392" y="312" class="mono out" font-size="13" fill="#A3C2A8" textLength="302" lengthAdjust="spacingAndGlyphs" opacity="0">backend · sécurité offensive · game dev<animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;1;1" keyTimes="0;0.12;1"/></text>
    <text x="392" y="334" class="mono" font-size="13" clip-path="url(#type2)" fill="#C8A96A" textLength="7.75" lengthAdjust="spacingAndGlyphs">$</text><text x="407.5" y="334" class="mono" font-size="13" clip-path="url(#type2)" fill="#E8EAF0" textLength="69.75" lengthAdjust="spacingAndGlyphs">cat motto</text>
    <text x="392" y="356" class="mono out" font-size="13" font-style="italic" fill="#E8EAF0" opacity="0" textLength="248" lengthAdjust="spacingAndGlyphs">une lame s'affûte tous les jours<animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;0.92;0.92" keyTimes="0;0.26;1"/></text>
    <g class="cursor" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;1;1" keyTimes="0;0.27;1"/>
      <rect x="648" y="345" width="8" height="14" fill="#C8A96A">
        <animate attributeName="opacity" calcMode="discrete" dur="1.1s" repeatCount="indefinite" values="1;0;0" keyTimes="0;0.5;1"/>
      </rect>
    </g>
  </g>
</svg>
