<svg viewBox="0 0 1000 580" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hTitle">
  <title id="hTitle">Yanis — l’as de pique : ingénieur cybersécurité, fondateur, développeur de jeux et de logiciels</title>

  <defs>
    <!-- La pique-lame : tracé maître réutilisé (emblème, index de coins, pips) -->
    <path id="spade" d="M100,8 C96,34 60,64 42,92 C28,114 26,132 34,148 C44,166 70,172 86,158 C92,152 96,146 97,140 C95,172 86,196 68,212 C64,216 66,220 71,220 L129,220 C134,220 136,216 132,212 C114,196 105,172 103,140 C104,146 108,152 114,158 C130,172 156,166 166,148 C174,132 172,114 158,92 C140,64 104,34 100,8 Z"/>
    <clipPath id="spadeClip"><use href="#spade"/></clipPath>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF7EE"/>
      <stop offset="0.55" stop-color="#F6F1E6"/>
      <stop offset="1" stop-color="#F0E9D9"/>
    </linearGradient>
    <linearGradient id="spadeSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E232D"/>
      <stop offset="0.45" stop-color="#2F3642"/>
      <stop offset="0.8" stop-color="#454E5C"/>
      <stop offset="1" stop-color="#333B47"/>
    </linearGradient>
    <linearGradient id="steelEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8934A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6B5527" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="steelText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171B22"/>
      <stop offset="0.6" stop-color="#2A3038"/>
      <stop offset="1" stop-color="#3E4654"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8934A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B8934A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#B8934A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8934A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B8934A" stop-opacity="0"/>
    </radialGradient>
    <filter id="spadeGlow" x="-40%%" y="-40%%" width="180%%" height="180%%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3A2F1B" flood-opacity="0.2"/>
    </filter>
    <filter id="cardShadow" x="-20%%" y="-20%%" width="140%%" height="140%%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#332A18" flood-opacity="0.15"/>
    </filter>
    <clipPath id="ulClip"><rect x="330" y="172.5" width="308" height="4"/></clipPath>

    <!-- Machines à écrire du terminal : fenêtres de clip -->
    <clipPath id="type1"><rect x="84.0" y="338.0" height="18" width="0">
      <animate attributeName="width" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze"
        values="0;7.75;15.50;23.25;31.00;38.75;46.50;54.25;62.00;62.00"
        keyTimes="0;0.04375;0.04844;0.05312;0.05781;0.06250;0.06719;0.07187;0.07656;1"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="84.0" y="386.0" height="18" width="0">
      <animate attributeName="width" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze"
        values="0;7.75;15.50;23.25;31.00;38.75;46.50;54.25;62.00;69.75;77.50;85.25;93.00;93.00"
        keyTimes="0;0.11875;0.12344;0.12812;0.13281;0.13750;0.14219;0.14687;0.15156;0.15625;0.16094;0.16562;0.17031;1"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="84.0" y="434.0" height="18" width="0">
      <animate attributeName="width" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze"
        values="0;7.75;15.50;23.25;31.00;38.75;46.50;54.25;62.00;69.75;77.50;85.25;93.00;100.75;108.50;116.25;116.25"
        keyTimes="0;0.21563;0.22031;0.22500;0.22969;0.23438;0.23906;0.24375;0.24844;0.25312;0.25781;0.26250;0.26719;0.27187;0.27656;0.28125;1"/>
    </rect></clipPath>
    <clipPath id="type4"><rect x="84.0" y="482.0" height="18" width="0">
      <animate attributeName="width" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze"
        values="0;7.75;15.50;23.25;31.00;38.75;46.50;54.25;62.00;69.75;77.50;85.25;85.25"
        keyTimes="0;0.32812;0.33281;0.33750;0.34219;0.34687;0.35156;0.35625;0.36094;0.36562;0.37031;0.37500;1"/>
    </rect></clipPath>
  </defs>

  <style>
    text { -webkit-user-select: none; user-select: none; }
    .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .serif { font-family: Georgia,'Times New Roman',serif; }
    .rise { opacity: 0; animation: rise 0.8s cubic-bezier(0.22,0.61,0.36,1) forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 0.4s; } .d4 { animation-delay: 0.55s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; opacity: 1; }
      .sheen-r, .cursor { display: none; }
      #type1 rect { width: 62.00px !important; }
      #type2 rect { width: 93.00px !important; }
      #type3 rect { width: 116.25px !important; }
      #type4 rect { width: 85.25px !important; }
      .out { opacity: 1 !important; }
    }
  </style>

  <!-- Carte -->
  <rect x="8" y="8" width="984" height="564" rx="18" fill="url(#bgGrad)" stroke="#D9D2C2" stroke-width="1.4"/>
  <rect x="20" y="20" width="960" height="540" rx="12" stroke="#E4DECF" stroke-opacity="0.9" stroke-width="1"/>

  <!-- Index de coins, comme sur une vraie carte -->
  <g id="idx">
    <text x="46" y="60" class="serif" font-size="30" fill="#14171C" text-anchor="middle">A</text>
    <use href="#spade" transform="translate(38.5,68) scale(0.075)" fill="#8C6E33"/>
  </g>
  <use href="#idx" transform="rotate(180 500 290)"/>

  <!-- Emblème : la pique comme une lame -->
  <g class="rise">
    <ellipse cx="170" cy="160" rx="165" ry="165" fill="url(#glow)"/>
    <g transform="translate(70,46) scale(1)">
      <g>
        <animateTransform attributeName="transform" type="translate" additive="sum"
          values="0 0;0 -6;0 0" keyTimes="0;0.5;1" dur="7s"
          calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
        <use href="#spade" fill="url(#spadeSteel)" stroke="url(#steelEdge)" stroke-width="1.5" filter="url(#spadeGlow)"/>
        <path d="M100,34 C101.6,62 101.6,102 100,140 C98.4,102 98.4,62 100,34 Z" fill="#C8A96A" opacity="0.5"/>
        <g clip-path="url(#spadeClip)">
          <g transform="skewX(-16)">
            <rect class="sheen-r" x="-70" y="-10" width="44" height="260" fill="url(#sheen)">
              <animateTransform attributeName="transform" type="translate"
                values="0 0;340 0;340 0" keyTimes="0;0.22;1" dur="9s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Bloc identité -->
  <g class="rise d1">
    <text x="330" y="104" class="mono" font-size="12" letter-spacing="4" fill="#7A5E28">// L’AS DE PIQUE</text>
  </g>
  <g class="rise d2">
    <text x="326" y="162" class="sans" font-size="58" font-weight="800" letter-spacing="10" fill="url(#steelText)" textLength="210" lengthAdjust="spacing">YANIS</text>
    <rect x="330" y="173.5" width="308" height="1.4" fill="#DDD6C6"/>
    <g clip-path="url(#ulClip)">
      <rect x="260" y="172.8" width="70" height="2.4" fill="url(#pulse)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;400 0;400 0" keyTimes="0;0.45;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Pills : ce qu’un recruteur doit lire en un coup d’œil -->
  <g class="rise d3">
    <g>
      <rect x="330" y="196" width="136" height="34" rx="17" stroke="#D3CCBB" stroke-width="1.2" fill="#14171C" fill-opacity="0.03"/>
      <g transform="translate(346,205)" stroke="#8C6E33" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2,1 V15.4" stroke-width="1.6"/><path d="M2,2.6 L13.2,2.6 L10.7,6.8 L13.2,11 L2,11" stroke-width="1.6"/></g>
      <text x="371.7" y="218" class="mono" font-size="12" letter-spacing="1.5" fill="#3A414D" textLength="78.3" lengthAdjust="spacingAndGlyphs">FONDATEUR</text>
    </g>
    <g>
      <rect x="479" y="196" width="170" height="34" rx="17" stroke="#D3CCBB" stroke-width="1.2" fill="#14171C" fill-opacity="0.03"/>
      <g transform="translate(495,205)" stroke="#8C6E33" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8,1 L14,3.5 V7.7 C14,11.3 11.4,13.5 8,14.5 C4.6,13.5 2,11.3 2,7.7 V3.5 Z" stroke-width="1.6"/></g>
      <text x="519.9" y="218" class="mono" font-size="12" letter-spacing="1.5" fill="#3A414D" textLength="113.1" lengthAdjust="spacingAndGlyphs">CYBERSÉCURITÉ</text>
    </g>
    <g>
      <rect x="662" y="196" width="118" height="34" rx="17" stroke="#D3CCBB" stroke-width="1.2" fill="#14171C" fill-opacity="0.03"/>
      <g transform="translate(678,205)" stroke="#8C6E33" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5,2.5 l5.5,4.5 -5.5,4.5" stroke-width="1.6"/><path d="M10.5,12 h5.5" stroke-width="1.6"/></g>
      <text x="703.1" y="218" class="mono" font-size="12" letter-spacing="1.5" fill="#3A414D" textLength="60.9" lengthAdjust="spacingAndGlyphs">BACKEND</text>
    </g>
    <g>
      <rect x="793" y="196" width="127" height="34" rx="17" stroke="#D3CCBB" stroke-width="1.2" fill="#14171C" fill-opacity="0.03"/>
      <g transform="translate(809,205)" stroke="#8C6E33" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1,8.5 a3,3 0 0 1 3,-3 h8 a3,3 0 0 1 3,3 v1.6 a2.6,2.6 0 0 1 -4.7,1.7 h-4.6 a2.6,2.6 0 0 1 -4.7,-1.7 z" stroke-width="1.5"/><path d="M3.6,8 h2.6 M4.9,6.7 v2.6" stroke-width="1.2"/><circle cx="12" cy="7.7" r="1" fill="#8C6E33" stroke="none"/></g>
      <text x="834.4" y="218" class="mono" font-size="12" letter-spacing="1.5" fill="#3A414D" textLength="69.6" lengthAdjust="spacingAndGlyphs">GAME DEV</text>
    </g>
  </g>

  <!-- Terminal -->
  <g class="rise d4">
    <rect x="60" y="286" width="860" height="254" rx="10" fill="#0C0F14" stroke="#232A36" stroke-width="1.2" filter="url(#cardShadow)"/>
    <path d="M61,318 H919" stroke="#202733" stroke-width="1"/>
    <circle cx="80" cy="302" r="4" fill="#6B7280"/>
    <circle cx="96" cy="302" r="4" fill="#9AA3B2"/>
    <circle cx="112" cy="302" r="4" fill="#C8A96A"/>
    <text x="132" y="306" class="mono" font-size="11" fill="#7E8794">yanis@spade:~</text>

    <text x="84.00" y="350" class="mono" font-size="13" clip-path="url(#type1)" fill="#C8A96A" textLength="7.75" lengthAdjust="spacingAndGlyphs">$</text>
    <text x="99.50" y="350" class="mono" font-size="13" clip-path="url(#type1)" fill="#E8EAF0" textLength="46.50" lengthAdjust="spacingAndGlyphs">whoami</text>
    <text x="84.00" y="374" class="mono out" font-size="13" fill="#A3C2A8" textLength="271.25" lengthAdjust="spacingAndGlyphs" opacity="0">ingénieur cybersécurité · fondateur<animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;1.0;1.0" keyTimes="0;0.09062;1"/></text>
    <text x="84.00" y="398" class="mono" font-size="13" clip-path="url(#type2)" fill="#C8A96A" textLength="7.75" lengthAdjust="spacingAndGlyphs">$</text>
    <text x="99.50" y="398" class="mono" font-size="13" clip-path="url(#type2)" fill="#E8EAF0" textLength="77.50" lengthAdjust="spacingAndGlyphs">ls ~/build</text>
    <text x="84.00" y="422" class="mono out" font-size="13" fill="#A3C2A8" textLength="201.50" lengthAdjust="spacingAndGlyphs" opacity="0">jeux/  logiciels/  outils/<animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;1.0;1.0" keyTimes="0;0.19062;1"/></text>
    <text x="84.00" y="446" class="mono" font-size="13" clip-path="url(#type3)" fill="#C8A96A" textLength="7.75" lengthAdjust="spacingAndGlyphs">$</text>
    <text x="99.50" y="446" class="mono" font-size="13" clip-path="url(#type3)" fill="#E8EAF0" textLength="100.75" lengthAdjust="spacingAndGlyphs">cat ~/.origin</text>
    <text x="84.00" y="470" class="mono out" font-size="13" fill="#A3C2A8" textLength="341.00" lengthAdjust="spacingAndGlyphs" opacity="0">depuis toujours : coder des outils, en vivre<animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;1.0;1.0" keyTimes="0;0.30312;1"/></text>
    <text x="84.00" y="494" class="mono" font-size="13" clip-path="url(#type4)" fill="#C8A96A" textLength="7.75" lengthAdjust="spacingAndGlyphs">$</text>
    <text x="99.50" y="494" class="mono" font-size="13" clip-path="url(#type4)" fill="#E8EAF0" textLength="69.75" lengthAdjust="spacingAndGlyphs">cat creed</text>
    <text x="84.00" y="518" class="mono out" font-size="13" font-style="italic" fill="#E8EAF0" textLength="410.75" lengthAdjust="spacingAndGlyphs" opacity="0">« celui qui tire doit être prêt à recevoir la balle »<animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;0.92;0.92" keyTimes="0;0.40000;1"/></text>
    <text x="518.00" y="518" class="mono out" font-size="13" fill="#6B7280" textLength="162.75" lengthAdjust="spacingAndGlyphs" opacity="0">— Lelouch, Code Geass<animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;1.0;1.0" keyTimes="0;0.40625;1"/></text>
    <g class="cursor" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="1" fill="freeze" values="0;1.0;1.0" keyTimes="0;0.40937;1"/>
      <rect x="688" y="506" width="8" height="14" fill="#C8A96A">
        <animate attributeName="opacity" calcMode="discrete" dur="1.1s" repeatCount="indefinite" values="1;0;0" keyTimes="0;0.5;1"/>
      </rect>
    </g>
  </g>
</svg>
